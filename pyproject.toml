[project]
name = "rspace-client"
version = "2.7.4"
description = "A client for calling RSpace ELN and Inventory APIs"
license = "Apache-2.0"
authors = [
  { name = "Research Innovations Ltd", email = "support@researchspace.com" },
]
maintainers = [
  { name = "Matthias Kowalski", email = "matthias@researchspace.com" },
  { name = "Robert Lamacraft", email = "robert.lamacraft@researchspace.com" },
]
readme = "README.md"
requires-python = ">=3.10"
keywords = ["RSpace", "ResearchSpace", "ELN", "Inventory"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "requests>=2.25.1,<3",
  "beautifulsoup4>=4.9.3,<5",
  "fs>=2.4.16,<3",           # deprecated PyFilesystem2 classes only (rspace_client.eln.fs, rspace_client.inv.attachment_fs); removed in 3.0
  "setuptools<82",            # fs 2.4.16 imports pkg_resources; goes with fs
  "fsspec>=2024.3.0",         # rspace_client.fs
]

# lets fsspec.filesystem("rspace") and rspace:// URLs work before rspace_client.fs is imported
[project.entry-points."fsspec.specs"]
rspace = "rspace_client.fs:RSpaceFilesystem"

[project.urls]
Repository = "https://github.com/rspace-os/rspace-client-python"
Documentation = "https://github.com/rspace-os/rspace-client-python"

[tool.poetry]
packages = [{ include = "rspace_client" }]
exclude = ["examples/*", "rspace_client/tests/*"]

[dependency-groups]
dev = [
  "python-dotenv>=1.1.1,<2",
  "pytest>=8.0.0,<9",
  "pytest-cov>=5.0.0",
  "responses>=0.26.2,<0.27",
  "universal-pathlib>=0.2",
  "ruff==0.16.3",
  "mypy==2.3.1",
  "pre-commit>=3.7",
]

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["rspace_client/tests"]
markers = [
    "integration: marks tests as integration tests requiring a live RSpace server (deselect with '-m not integration')",
]

[tool.coverage.run]
source = ["rspace_client"]
omit = ["rspace_client/tests/*", "rspace_client/notebook_sync/*"]

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = ["rspace_client/notebook_sync", "jupyter_notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# `ruff format` already wraps every line it safely can at 88 columns; what's
# left is mostly long strings, URLs and comments that splitting would only
# make harder to read, so line length is left to the formatter rather than
# enforced as a lint error.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# tree_upload.py passes lambdas straight into a helper that invokes them
# synchronously within the same loop iteration, so the loop-variable capture
# ruff warns about here is never actually stale.
"examples/tree_upload.py" = ["B023"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
# Much of this codebase predates type hints and still relies on `= None`
# defaults with a non-Optional annotation; restore mypy's pre-1.0 behaviour
# of treating that as implicitly Optional rather than annotating every call
# site as part of a tooling change. Revisit as part of the Phase 3 full-typing
# pass (see .claude/rspace-python-client-improvement.md).
implicit_optional = true
exclude = ["rspace_client/notebook_sync"]
