[tool.poetry]
name = "rspace-client"
version = "2.7.4"
description = "A client for calling RSpace ELN and Inventory APIs"
license = "Apache-2.0"
authors = ["Research Innovations Ltd <support@researchspace.com>"]
maintainers = [
  "Matthias Kowalski <matthias@researchspace.com>",
  "Robert Lamacraft <robert.lamacraft@researchspace.com>"
]
readme = "README.md"
repository = "https://github.com/rspace-os/rspace-client-python"
documentation = "https://github.com/rspace-os/rspace-client-python"
keywords = ["RSpace", "ResearchSpace", "ELN", "Inventory"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Topic :: Software Development :: Libraries",
]
exclude = ["examples/*", "rspace_client/tests/*"]

[tool.poetry.dependencies]
python = "^3.9"
requests = "^2.25.1"
beautifulsoup4 = "^4.9.3"
fs = "^2.4.16"           # deprecated PyFilesystem2 classes only (rspace_client.eln.fs, rspace_client.inv.attachment_fs); removed in 3.0
setuptools = "<82"       # fs 2.4.16 imports pkg_resources; goes with fs
fsspec = ">=2024.3.0"   # rspace_client.fs

# lets fsspec.filesystem("rspace") and rspace:// URLs work before rspace_client.fs is imported
[tool.poetry.plugins."fsspec.specs"]
rspace = "rspace_client.fs:RSpaceFilesystem"

[tool.poetry.group.dev.dependencies]
python-dotenv = "^1.1.1"
black = "^21.6b0"
pytest = "^8.0.0"
responses = "^0.26.2"
universal-pathlib = ">=0.2"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["rspace_client/tests"]
markers = [
    "integration: marks tests as integration tests requiring a live RSpace server (deselect with '-m not integration')",
]
